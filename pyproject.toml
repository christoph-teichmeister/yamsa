[project]
name = "yamsa"
version = "0.1.0"
description = "Yet another money split app"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ambient-toolbox==12.*",
    "django-axes==8.*",
    "django-cloudinary-storage==0.*",
    "django-context-decorator==1.*",
    "django-environ==0.*",
    "django-extensions==4.*",
    "django-htmx==1.*",
    "django-minify-html==1.*",
    "django-passkeys==2.*",
    "django-pony-express==3.*",
    "django-webpack-loader==3.*",
    "django[argon2]==6.*",
    "emoji==2.*",
    "gunicorn==26.*",
    "minify-html==0.18.*",
    "model-bakery==1.*",
    "pillow==12.*",
    "psycopg2-binary==2.*",
    "pytest==9.*",
    "pywebpush==2.*",
    "sentry-sdk[django]==2.*",
    "whitenoise==6.*",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "django-browser-reload",
    "django-debug-toolbar",
    "django-upgrade",
    "djlint",
    "freezegun",
    "playwright",
    "ruff",
    "factory-boy",
    "pytest-django",
    "pytest-env",
    "pytest-factoryboy",
    "pytest-playwright",
    "html5lib>=1.1",
]

[build-system]
requires = [
    "setuptools==84.*",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "render_sh_scripts*"]

[tool.coverage.run]
branch = true
# do not test these things
omit = [
    "*/config/*",
    "*/migrations/*",
    "*/templates/*",
    "*/tests/*",
    "*/apps.py",
    "*/__init__.py",
    "*/scripts/*.py",
    "*/management/commands/*.py",
    "*.html",
    "*.txt",
    "*.json",
    "*.env",
    "*.sh",
]

[tool.coverage.report]
precision = 2

show_missing = true

# Don’t report files that have no executable code (such as __init__.py files).
skip_empty = true

# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "if self\\.debug",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apps.config.settings"
python_files = [
    "test_*.py",
]
testpaths = [
    "apps",
]
markers = [
    "e2e: End-to-end tests via Playwright (run separately with `pytest e2e/`)",
    "expects_htmx_errors: The test severs the connection, so htmx logs its own errors to the console",
]
env = [
    "DJANGO_TESTING=1",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.djlint]
ignore = ["H021"]
profile = "django"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*/migrations/*",
]

# Same as Black.
line-length = 120

fix = true

# Assume Python 3.13.
target-version = "py313"  # Fixed version from onrender.com (If you change this, also change it in the Dockerfile!)

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "ASYNC", # flake8-async
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # Checks for unnecessary comprehensions
    "C90", # mccabe complexity
    "D", # pydocstyle
    "DJ", # flake8-django
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "EM", # flake8-errmsg
    "ERA", # eradicate commented-out code
    "EXE", # flake8-executable
    "F", # Pyflakes
    "FLY", # flynt f-string conversion
    "FURB", # refurb, modern idioms
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "INT", # Validates your gettext translation strings
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N", # pep8-naming
    "PERF", # Perflint
    "PGH", # No all-purpose "# noqa" and eval validation
    "PIE", # Bunch of useful rules
    "PL", # Pylint
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # Removes unnecessary "#noqa" comments
    "S", # flake8-bandit
    "SIM", # Simplifies your code
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TD", # flake8-todos
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops, exception-handling patterns
    "UP", # PyUpgrade
    "W", # pycodestyle warnings
    "YTT", # Avoid non-future-prove usages of "sys"
    # "FBT",     # Protects you from the "boolean trap bug"
    # "ARG",     # Unused arguments - almost every hit is a Django/pytest-mandated signature (view/admin/context-processor overrides, fixture activation, test doubles), not a real bug
    "ANN202", # Missing return type hint for private function (#455, staged ANN rollout, step 6)
    "ANN003", # Missing type hint for **kwargs (#455, staged ANN rollout, step 5)
    "ANN002", # Missing type hint for *args (#455, staged ANN rollout, step 4)
    "ANN204", # Missing return type hint for magic method (#455, staged ANN rollout, step 3)
    "ANN401", # Disallow `typing.Any` in type hints (#455, staged ANN rollout, smallest rule count first)
    "ANN205", # Missing return type hint for @staticmethod (#455, staged ANN rollout, step 2)
    # "ANN",     # Missing type hints - no safe autofix; would mean hand-annotating ~4400 existing call sites, a separate typing effort
]
ignore = [
    'N999', # Project name contains underscore, not fixable
    'A003', # Django attributes shadow python builtins
    'DJ001', # Django model text-based fields shouldn't be nullable
    'DJ012', # Odd ordering of Django model methods
    'RUF012', # Mutable class attributes should be annotated with `typing.ClassVar`
    'PERF401', # Use a list comprehension to create a transformed list
    'ISC001', # Conflicts with the ruff formatter (multi-line implicit string concat)
    'TRY003', # Overlaps with EM101/EM102, which already own exception-message wording
    'D100', 'D101', 'D102', 'D103', 'D104', 'D105', 'D106', 'D107', # Missing docstrings - not retrofitted repo-wide, only style rules (D2xx/D4xx) are enforced
    'PLC0415', # Django apps import locally to dodge circular imports at app-loading time; this is idiomatic here, not a smell
    'SLF001', # Almost every hit is Django's own underscore-prefixed but semi-public API (`Model._meta`, `QueryDict._mutable`)
    'TD003', # Pre-existing TODOs predate the project's issue tracker discipline; can't retroactively fabricate a link
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "N", # pep8-naming
    "I", # isort
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "DTZ", # flake8-datetimez
    "DJ", # flake8-django
    "EM", # flake8-errmsg
    "RUF", # Removes unnecessary "#noqa" comments
    "YTT", # Avoid non-future-prove usages of "sys"
    # "FBT",     # Protects you from the "boolean trap bug"
    "C4", # Checks for unnecessary comprehensions
    "PIE", # Bunch of useful rules
    "SIM", # Simplifies your code
    "INT", # Validates your gettext translation strings
    "PERF", # Perflint
    "PGH", # No all-purpose "# noqa" and eval validation
    "UP", # PyUpgrade
    "G", # flake8-logging-format
    "LOG", # flake8-logging
    "FLY", # flynt f-string conversion
    "FURB", # refurb, modern idioms
    "ISC", # flake8-implicit-str-concat
    "RET", # flake8-return
    "RSE", # flake8-raise
    "D", # pydocstyle
]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    # Allows "imported but unused" in init files
    "F401",
]
"**/apps.py" = [
    # Allows "imported but unused" in init files
    "F401",
]
"**/tests/*" = [
    "S101", # assert use is the point of a test
    "S105", "S106", # fixture/test credentials aren't real secrets
    "PLR2004", # magic values are normal in test assertions
]
"**/test_*.py" = [
    "S101", # assert use is the point of a test
    "S105", "S106", # fixture/test credentials aren't real secrets
    "PLR2004", # magic values are normal in test assertions
]
"conftest.py" = [
    "S101", # assert use is the point of a test
]
"e2e/**" = [
    "S101", # Playwright page objects assert on page state, that's their job
]
"**/management/commands/*.py" = [
    "T201", # management commands talk to the operator via stdout, that's the interface
    "S105", # dev/anonymisation fixtures reset accounts to a known non-production password, not a leaked secret
]
"scripts/*.py" = [
    "T201", # standalone dev scripts talk to the operator via stdout, that's the interface
    "INP001", # standalone dev scripts, not a Python package
]
"scripts/**" = [
    "INP001", # standalone dev scripts, not a Python package
]
"apps/core/event_loop/**" = [
    "T201", # event bus autodiscovery/creation logging predates structured logging here
]
"apps/core/context_managers/measure_time_and_queries_context_manager.py" = [
    "T201", # print is the debug-output mechanism this context manager exists to provide
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8 # Django views/forms/signals routinely take more than the default 5

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[dependency-groups]
dev = [
    "djlint==1.46.3",
]
