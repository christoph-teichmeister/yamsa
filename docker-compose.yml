services:
  database:
    image: postgres:18.6-alpine
    networks:
      default:
        aliases:
          - yamsa_database
    environment:
      POSTGRES_DB: yamsa_db
      POSTGRES_USER: yamsa-postgres-user
      POSTGRES_PASSWORD: yamsa-password
    volumes:
      - yamsa_postgres_data:/var/lib/postgresql/
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    restart: "always"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamsa-postgres-user -d yamsa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      database:
        condition: service_healthy
      mailhog:
        condition: service_started
    build:
      context: .
      args:
        UV_EXPORT_ARGS: "--extra dev"
    networks:
      default:
        aliases:
          - yamsa_backend
    command: bash ./scripts/run_backend_local.sh
    volumes:
      - .:/src
      - ./apps/static/webpack_bundles:/src/apps/static/webpack_bundles
      - /src/node_modules
      - ./apps/static:/src/apps/static
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: "no"

  mailhog:
    image: axllent/mailpit:v1.31
    networks:
      default:
        aliases:
          - yamsa_mailhog
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"  # email inbox interface
      - "${MAILHOG_SMTP_PORT:-1025}:1025"  # smtp

volumes:
  yamsa_postgres_data:
