{% load i18n core_tags %}
{% trans "Close" as toast_close_label %}
<div class="yamsa-toast-container tw:pointer-events-none tw:fixed tw:bottom-0 tw:left-1/2 tw:z-[1400] tw:mb-12 tw:max-h-[calc(100%-1rem)] tw:w-full tw:-translate-x-1/2 tw:px-1 tw:pb-12">
  <div class="tw:translate-y-2 tw:opacity-0 tw:transition tw:duration-250 tw:data-visible:translate-y-0 tw:data-visible:opacity-100"
       id="toast-id"
       role="alert"
       aria-live="assertive"
       aria-atomic="true"
       hidden>
    <div id="toast-type-div"
         class="toast-yamsa-inner tw:flex tw:w-full tw:items-center tw:justify-between tw:gap-3 tw:px-4 tw:py-3">
      <span id="toast-message-span" class="tw:min-w-0 tw:flex-1 tw:truncate tw:font-semibold"></span>
      <button type="button"
              class="tw:inline-flex tw:size-8 tw:shrink-0 tw:items-center tw:justify-center tw:rounded-full tw:border tw:border-transparent tw:bg-transparent tw:text-ink-muted tw:transition tw:hover:bg-surface-hover tw:hover:text-ink tw:focus-visible:outline-2 tw:focus-visible:outline-offset-2 tw:focus-visible:outline-brand"
              data-toast-dismiss
              aria-label="{{ toast_close_label }}">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
{% if queued_toasts %}
  {% json_script_nonce queued_toasts "queued-toasts-data" %}
{% else %}
  <script id="queued-toasts-data"
          type="application/json"
          nonce="{{ csp_nonce }}">[]</script>
{% endif %}
{% trans "Something went wrong" as something_went_wrong %}
<script type="module" nonce="{{ csp_nonce }}">
    // Must match `tw:duration-250` on #toast-id: the queue waits out the fade before it shows the
    // next toast, and a transitionend listener would never fire for a reader on reduced motion.
    const TRANSITION_MS = 250
    const AUTOHIDE_MS = 5000

    const initializeToastHandler = () => {
        const toastElement = document.getElementById("toast-id")
        const toastTypeDiv = document.getElementById("toast-type-div")
        const toastMessageSpan = document.getElementById("toast-message-span")
        if (!toastElement || !toastTypeDiv || !toastMessageSpan) {
            console.warn("Toast markup missing; skipping toast initialization.")
            return
        }

        // Read once from the markup rather than repeated here: the tone classes below are applied
        // by replacing className, and a second copy of this string would drift from the template.
        const baseToastClasses = toastTypeDiv.className
        const defaultErrorToastClasses = "{{ toast_classes.error|escapejs }}"
        const defaultErrorMessage = "⚠️ {{ something_went_wrong|escapejs }} 🥺"

        let toastIsVisible = false
        let autohideTimer = null
        const toastQueue = []

        const applyToastClasses = (classString = "") => {
            toastTypeDiv.className = baseToastClasses
            classString.split(" ").forEach((typeString) => {
                if (typeString.trim()) {
                    toastTypeDiv.classList.add(typeString)
                }
            })
        }

        const enqueueToast = (toastDetail) => {
            if (!toastDetail || !toastDetail.message) {
                return
            }

            toastQueue.push(toastDetail)
        }

        const hideToast = () => {
            if (!toastIsVisible) {
                return
            }

            window.clearTimeout(autohideTimer)
            delete toastElement.dataset.visible
            window.setTimeout(() => {
                // Hidden rather than merely transparent: the toast sits above the page's bottom
                // edge and would keep swallowing clicks there for the rest of the session.
                toastElement.hidden = true
                toastIsVisible = false
                showNextToast()
            }, TRANSITION_MS)
        }

        const showToast = () => {
            toastIsVisible = true
            toastElement.hidden = false
            // A transition needs a frame in which the element is laid out at its from-state;
            // setting both in one go would snap it into place.
            window.requestAnimationFrame(() => {
                toastElement.dataset.visible = "true"
            })
            autohideTimer = window.setTimeout(hideToast, AUTOHIDE_MS)
        }

        const showNextToast = () => {
            if (toastIsVisible || toastQueue.length === 0) {
                return
            }

            const toastDetail = toastQueue.shift()
            toastMessageSpan.innerText = toastDetail.message
            applyToastClasses(toastDetail.type)
            showToast()
        }

        const normalizeToastPayloads = (payload) => {
            if (!payload) {
                return []
            }

            if (Array.isArray(payload)) {
                return payload.reduce((acc, entry) => {
                    acc.push(...normalizeToastPayloads(entry))
                    return acc
                }, [])
            }

            if (typeof payload === "object") {
                if ("value" in payload && payload.value !== undefined) {
                    return normalizeToastPayloads(payload.value)
                }
                if (payload.triggerToast) {
                    return normalizeToastPayloads(payload.triggerToast)
                }
                if (payload.message) {
                    return [payload]
                }
            }

            return []
        }

        const dispatchQueuedToasts = () => {
            const queuedToastsElement = document.getElementById("queued-toasts-data")
            if (!queuedToastsElement) {
                return
            }

            try {
                const initialToasts = JSON.parse(queuedToastsElement.textContent || "[]")
                if (Array.isArray(initialToasts)) {
                    initialToasts.forEach(enqueueToast)
                }
            } catch {
                // swallow parsing errors
            }
        }

        toastElement.addEventListener("click", (event) => {
            if (event.target.closest("[data-toast-dismiss]")) {
                hideToast()
            }
        })

        document.body.addEventListener("triggerToast", (evt) => {
            const payloads = normalizeToastPayloads(evt.detail)
            payloads.forEach(enqueueToast)
            showNextToast()
        })

        document.body.addEventListener("htmx:afterRequest", (evt) => {
            if (evt.detail?.successful) {
                return
            }
            enqueueToast({
                message: defaultErrorMessage,
                type: defaultErrorToastClasses,
            })
            showNextToast()
        })

        dispatchQueuedToasts()
        showNextToast()
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeToastHandler)
    } else {
        initializeToastHandler()
    }
</script>
