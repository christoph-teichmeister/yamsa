{% load i18n %}
<button class="tw:inline-flex tw:cursor-pointer tw:items-center tw:gap-1.5 tw:rounded-lg tw:border-0 tw:bg-transparent tw:p-0 tw:text-sm tw:font-semibold tw:text-brand-text tw:transition tw:hover:text-brand tw:focus-visible:outline-2 tw:focus-visible:outline-offset-2 tw:focus-visible:outline-brand"
        type="button"
        data-stop-propagation="true"
        hx-get="{% room_url 'account:guest-send-invitation-email' pk=user.id %}"
        hx-target="#body"
        hx-indicator="#body-loading-spinner"
        hx-swap="morph:innerHTML"
        hx-push-url="true">
  <i class="bi bi-envelope" aria-hidden="true"></i>
  {% trans "Send invitation email" %}
</button>
