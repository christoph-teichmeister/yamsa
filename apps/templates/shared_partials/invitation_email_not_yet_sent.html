{% load i18n %}
<button class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg border-0 bg-transparent p-0 text-sm font-semibold text-brand-text transition hover:text-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
        type="button"
        data-stop-propagation="true"
        hx-get="{% room_url 'account:guest-send-invitation-email' pk=user.id %}"
        hx-target="#body"
        hx-indicator="#body-loading-spinner"
        hx-swap="morph:innerHTML"
        hx-push-url="true">
  {% icon "envelope" %}
  {% trans "Send invitation email" %}
</button>
