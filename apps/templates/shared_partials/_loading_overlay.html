{% load i18n %}
<div id="{{ loader_id }}-overlay"
     class="loading-overlay-message"
     style="display: none">
  <div class="loading-overlay-message-content">
    <div class="tw:inline-block tw:size-4 tw:animate-spinner-grow tw:rounded-full tw:bg-current tw:opacity-0"
         role="status">
      <span class="tw:sr-only">{% trans "Loading..." %}</span>
    </div>
    <div class="tw:text-sm">{% trans "This is taking longer than expected!" %}</div>
  </div>
</div>
