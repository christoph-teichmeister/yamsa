{% load i18n %}
<div id="{{ loader_id }}-overlay"
     class="loading-overlay-message"
     style="display: none">
  <div class="loading-overlay-message-content">
    <div class="spinner-grow spinner-grow-sm text-primary-emphasis"
         role="status">
      <span class="visually-hidden">{% trans "Loading..." %}</span>
    </div>
    <div class="small">{% trans "This is taking longer than expected!" %}</div>
  </div>
</div>
