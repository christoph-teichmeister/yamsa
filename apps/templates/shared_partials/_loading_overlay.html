{% load i18n %}
<div id="{{ loader_id }}-overlay"
     class="loading-overlay-message"
     style="display: none">
  <div class="loading-overlay-message-content">
    <div class="inline-block size-4 animate-spinner-grow rounded-full bg-current opacity-0"
         role="status">
      <span class="sr-only">{% trans "Loading..." %}</span>
    </div>
    <div class="text-sm">{% trans "This is taking longer than expected!" %}</div>
  </div>
</div>
