{% load i18n %}
{% comment %}
Layout and visibility belong to .loading-indicator-overlay: the overlay is switched by `display`,
and a utility for it here would be the second declaration of the same thing.
{% endcomment %}
<div id="{{ spinner_id }}"
     class="htmx-indicator loading-indicator-overlay">
  <div class="inline-block size-8 animate-spinner-grow rounded-full bg-current opacity-0"
       role="status">
    <span class="sr-only">{% trans "Loading..." %}</span>
  </div>
</div>
