<script nonce="{{ csp_nonce }}">

  // Convert a base64 URL to Uint8Array
  function urlB64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
      .replace(/\-/g, '+')
      .replace(/_/g, '/');

    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    return outputArray.map((output, index) => rawData.charCodeAt(index));
  }

  // Send subscription data to the server
  const sendSubData = (subscription) => {
    const browser = (navigator.userAgent.match(/(firefox|msie|chrome|safari|trident)/i)?.[0] ?? 'unknown').toLowerCase();
    const data = {
      status_type: 'subscribe',
      subscription: subscription.toJSON(),
      browser: browser,
    };

    return fetch('{% url "webpush:save" %}', {
      method: 'POST',
      body: JSON.stringify(data),
      headers: {
        'content-type': 'application/json',
        'X-CSRFToken': '{{ csrf_token }}'
      },
      credentials: "include"
    })
      .then(handleResponse)
      .catch(error => console.error('Error sending subscription data:', error));
  };

  // Handle the server response
  const handleResponse = (res) => {
    {% if PWA_SERVICE_WORKER_DEBUG %}
      console.debug("handleResponse, status:", res.status);
    {% endif %}
  };

  // Browsers (iOS Safari above all) ignore a permission prompt that no user gesture triggered, so an
  // undecided permission is only ever requested from inside a click handler.
  const ensureNotificationPermission = (allowPrompt) => new Promise(resolve => {
    if (!('Notification' in window)) {
      resolve('denied');
      return;
    }

    if (Notification.permission === 'granted' || Notification.permission === 'denied') {
      resolve(Notification.permission);
      return;
    }

    if (!allowPrompt || typeof Notification.requestPermission !== 'function') {
      resolve(Notification.permission);
      return;
    }

    let settled = false;
    const finish = (value) => {
      if (!settled) {
        settled = true;
        resolve(value || Notification.permission);
      }
    };

    try {
      const outcome = Notification.requestPermission((permission) => finish(permission));
      if (outcome && typeof outcome.then === 'function') {
        outcome.then(finish).catch(() => finish(Notification.permission));
      }
    } catch (error) {
      finish(Notification.permission);
    }
  });

  // Validate, that the correct permissions have been given
  const setupIsValid = (registration) => {

    {% if PWA_SERVICE_WORKER_DEBUG %}
      console.log("Notification.permission", Notification.permission)
    {% endif %}

    // Check if notifications are supported
    if (!registration.showNotification) {
      console.warn("Showing notifications isn't supported");
      return false;
    }

    // Check if the user has denied notifications
    if (Notification.permission === 'denied') {
      console.warn('Notifications are blocked for this site');
      return false;
    }

    // Check if PushManager is supported
    if (!('PushManager' in window)) {
      console.warn("Push isn't allowed in this browser");
      return false;
    }
    return true
  }

  // Handle the success of service worker registration
  const handleRegistrationSuccess = (registration, allowPrompt = false) => {
    ensureNotificationPermission(allowPrompt).then(permission => {
      if (permission !== 'granted') {
        {% if PWA_SERVICE_WORKER_DEBUG %}
          console.warn('Skipping push subscription because notification permission is', permission);
        {% endif %}
        return;
      }

      if (!setupIsValid(registration))
        return

      // Check for an active subscription
      registration.pushManager.getSubscription()
        .then(subscription => {
          if (subscription) {
            sendSubData(subscription);
          } else {
            // Get the VAPID public key and create subscription options
            const key = "{{WEBPUSH_SETTINGS.VAPID_PUBLIC_KEY}}"
            const options = {
              userVisibleOnly: true,
              ...(key && {applicationServerKey: urlB64ToUint8Array(key)})
            };

            // Subscribe and send subscription data
            registration.pushManager.subscribe(options)
              .then(sub => sendSubData(sub))
              .catch(error => {
                console.error('Error subscribing:', error)
                if (error.toString().includes("AbortError: Registration failed - push service error")) {
                  console.warn(
                    "Push registration failed. In Brave, enable 'Use Google services for push " +
                    "messaging' under brave://settings/privacy."
                  )
                }
              });
          }
        })
        .catch(error => console.error('Error getting subscription:', error));
    });
  };

  // Initialize the service worker
  const initServiceWorker = () => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('{% url "core:serviceworker" %}', {
        scope: '{{ manifest.scope }}'
      })
        .then((registration) => {
          // Registration was successful
          {% if PWA_SERVICE_WORKER_DEBUG %}
            console.info('ServiceWorker registration successful with scope: ', registration.scope);
          {% endif %}

          {% if user.wants_to_receive_webpush_notifications %}
            handleRegistrationSuccess(registration);
          {% endif %}
        })
        .catch(err => {
          // Registration failed :(
          {% if PWA_SERVICE_WORKER_DEBUG %}
            console.error('ServiceWorker registration failed: ', err);
          {% endif %}
        });
    }
  }

  {% if PWA_SERVICE_WORKER_DEBUG %}
    console.debug('ServiceWorker initialising');
  {% endif %}

  initServiceWorker()

  document.addEventListener("notificationsEnabled", (evt) => {
    var notificationsEnabled = evt.detail.value

    navigator.serviceWorker.getRegistrations().then(registrationArray => {
      registrationArray.map(registration => {
        if (notificationsEnabled === true) {
          if (!('Notification' in window)) {
            return;
          }
          if (Notification.permission === 'default') {
            // The event arrives with an htmx response, outside any gesture: ask on the next tap.
            document.addEventListener('click', () => handleRegistrationSuccess(registration, true), {once: true});
          } else {
            handleRegistrationSuccess(registration)
          }
        } else {
          registration.pushManager.getSubscription().then((subscription) => {
            if (!subscription) {
              return;
            }
            subscription
              .unsubscribe()
              .then((successful) => {
                // Successfully unsubscribed

                {% if PWA_SERVICE_WORKER_DEBUG %}
                  console.log("unsubscribed")
                {% endif %}
              })
              .catch((e) => {
                // Unsubscribing failed
                console.error(e)
              });
          });
        }
      })
    })
  })
</script>
