{% comment %}
  The one action the offline page has. Its own template because _error_page.html renders it as
  the optional slot under the card.
{% endcomment %}
<button class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl border border-transparent bg-brand px-5 py-2.5 text-sm font-semibold text-on-brand shadow-brand transition hover:bg-brand-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand active:scale-95"
        type="button"
        hx-trigger="click"
        hx-get="{% url 'core:welcome' %}"
        hx-target="#body"
        hx-indicator="#body-loading-spinner"
        hx-swap="morph:innerHTML"
        hx-push-url="true">
  {% icon "arrow-clockwise" %}
  Retry for internet
</button>
