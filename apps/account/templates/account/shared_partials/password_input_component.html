<div class="mb-4">
    <label for="password" class="block text-sm font-medium mb-1">{{ form.fields.password.label }}</label>
    <div class="flex">
        <input type="password"
               class="ym-input rounded-r-none"
               id="password"
               name="password"
               autocomplete="{{ password_autocomplete|default:'current-password' }}"
               required>
        <span class="flex items-center justify-center px-3 border border-l-0 border-gray-300 dark:border-dark-border bg-gray-50 dark:bg-dark-surface rounded-r-lg cursor-pointer"
              id="password-eye">
            <i class="flex bi bi-eye-slash"></i>
        </span>
    </div>
    {% for error_message in form.errors.password.data %}
        <small class="text-danger-500" id="passwordError">{{ error_message.message }}</small>
    {% endfor %}
</div>
<script type="text/javascript" nonce="{{ csp_nonce }}">
  var passwordEyeElement = document.getElementById('password-eye')
  var passwordInput = document.getElementById('password')

  var passwordHiddenIcon = '<i class="flex bi bi-eye-slash"></i>'
  var passwordVisibleIcon = '<i class="flex bi bi-eye"></i>'

  passwordEyeElement.addEventListener("click", (event) => {
    if (passwordInput.type === "text") {
      passwordInput.type = "password"
      passwordEyeElement.innerHTML = passwordHiddenIcon
    } else {
      passwordInput.type = "text"
      passwordEyeElement.innerHTML = passwordVisibleIcon
    }
  })
</script>
