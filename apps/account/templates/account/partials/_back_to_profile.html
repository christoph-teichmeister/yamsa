{% load i18n %}
{# An anchor, not a button: the back link then works without the bundle and can be opened in a new tab. #}
<a class="tw:inline-flex tw:cursor-pointer tw:items-center tw:gap-1.5 tw:self-start tw:rounded-lg tw:border-0 tw:bg-transparent tw:px-1 tw:py-1 tw:text-sm tw:font-semibold tw:text-ink-muted tw:no-underline tw:transition tw:hover:text-ink tw:focus-visible:outline-2 tw:focus-visible:outline-offset-2 tw:focus-visible:outline-brand"
   href="{% url 'account:detail' pk=user.id %}"
   data-back-to-profile
   hx-get="{% url 'account:detail' pk=user.id %}"
   hx-target="#body"
   hx-indicator="#body-loading-spinner"
   hx-swap="morph:innerHTML"
   hx-push-url="true">
  <i class="bi bi-chevron-left" aria-hidden="true"></i>
  {% trans "Back to profile" %}
</a>
