{% load i18n %}
{# An anchor, not a button: the back link then works without the bundle and can be opened in a new tab. #}
<a class="inline-flex cursor-pointer items-center gap-1.5 self-start rounded-lg border-0 bg-transparent px-1 py-1 text-sm font-semibold text-ink-muted no-underline transition hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
   href="{% url 'account:detail' pk=user.id %}"
   data-back-to-profile
   hx-get="{% url 'account:detail' pk=user.id %}"
   hx-target="#body"
   hx-indicator="#body-loading-spinner"
   hx-swap="morph:innerHTML"
   hx-push-url="true">
  {% icon "chevron-left" %}
  {% trans "Back to profile" %}
</a>
