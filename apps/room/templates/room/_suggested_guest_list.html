{% load i18n %}
<div id="suggested-guests-list"
     class="@container grid grid-cols-1 gap-3 @lg:grid-cols-2">
  {% if suggested_guests %}
    {% for guest in suggested_guests %}
      {% include "room/_suggested_guest_card.html" with guest=guest %}
    {% endfor %}
  {% else %}
    <p class="m-0 text-sm text-ink-subtle">
      {% trans "No frequent collaborators yet — create more rooms to surface suggestions." %}
    </p>
  {% endif %}
</div>
