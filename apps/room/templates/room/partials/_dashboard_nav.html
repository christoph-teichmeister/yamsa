{% load room_tags %}
{% comment %}
z-1030 is where Bootstrap's .fixed-bottom put this bar, and the floating "add" pill of the
transaction feed sits at 1050 on the assumption that it clears it.
{% endcomment %}
<nav class="tw:fixed tw:inset-x-0 tw:bottom-0 tw:z-[1030] tw:bg-surface-sunken tw:pt-2 tw:pb-6">
  <div class="tw:app-container">
    <div class="tw:flex tw:w-full tw:flex-row tw:justify-around">
      {% for tab in dashboard_tabs %}
        <a class="tw:cursor-pointer tw:rounded-lg tw:px-4 tw:py-2 tw:text-[1.3rem] tw:no-underline tw:transition tw:focus-visible:outline-2 tw:focus-visible:outline-offset-2 tw:focus-visible:outline-brand {% if active_tab == tab.name %}tw:text-brand-text{% else %}tw:text-ink tw:hover:text-brand-text{% endif %}"
           id="{{ tab.name }}-tab"
           role="tab"
           aria-label="{{ tab.name }}"
           aria-controls="{{ tab.name }}"
           aria-selected="{% if active_tab == tab.name %}true{% else %}false{% endif %}"
           {% if active_tab == tab.name %}aria-current="page"{% endif %}
           hx-trigger="click"
           hx-get="{{ tab.get_url }}"
           hx-indicator="#body-loading-spinner"
           hx-target="#body"
           hx-swap="morph:innerHTML"
           hx-push-url="true">
          <i class="{{ tab.icon_class }}" aria-hidden="true"></i>
          <span class="tw:sr-only">{{ tab.name }}</span>
        </a>
      {% endfor %}
    </div>
  </div>
</nav>
