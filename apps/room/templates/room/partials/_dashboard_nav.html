{% load room_tags %}
<nav class="ym-navbar ym-fixed-bottom z-4 pb-4">
    <div class="flex w-full justify-around px-4">
        {% for tab in dashboard_tabs %}
            <a class="cursor-pointer px-3 py-2 rounded-lg text-lg transition-colors {% if active_tab == tab.name %}text-blue-500{% else %}text-text-secondary hover:text-text-primary{% endif %}"
               id="{{ tab.name }}-tab"
               role="tab"
               aria-label="{{ tab.name }}"
               aria-controls="{{ tab.name }}"
               aria-selected="{% if active_tab == tab.name %}true{% else %}false{% endif %}"
               {% if active_tab == tab.name %}aria-current="page"{% endif %}
               hx-trigger="click"
               hx-get="{{ tab.get_url }}"
               hx-indicator="#body-loading-spinner"
               hx-target="#body"
               hx-swap="morph:innerHTML"
               hx-push-url="true">
                <i class="{{ tab.icon_class }}" aria-hidden="true"></i>
                <span class="sr-only">{{ tab.name }}</span>
            </a>
        {% endfor %}
    </div>
</nav>
