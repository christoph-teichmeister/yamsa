{% load room_tags %}
{% comment %}
z-1030 is where Bootstrap's .fixed-bottom put this bar, and the floating "add" pill of the
transaction feed sits at 1050 on the assumption that it clears it.
{% endcomment %}
<nav class="fixed inset-x-0 bottom-0 z-[1030] bg-surface-sunken pt-2 pb-6">
  <div class="app-container">
    <div class="flex w-full flex-row justify-around">
      {% for tab in dashboard_tabs %}
        <a class="cursor-pointer rounded-lg px-4 py-2 text-[1.3rem] no-underline transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand {% if active_tab == tab.name %}text-brand-text{% else %}text-ink hover:text-brand-text{% endif %}"
           id="{{ tab.name }}-tab"
           role="tab"
           aria-label="{{ tab.name }}"
           aria-controls="{{ tab.name }}"
           aria-selected="{% if active_tab == tab.name %}true{% else %}false{% endif %}"
           {% if active_tab == tab.name %}aria-current="page"{% endif %}
           hx-trigger="click"
           hx-get="{{ tab.get_url }}"
           hx-indicator="#body-loading-spinner"
           hx-target="#body"
           hx-swap="morph:innerHTML"
           hx-push-url="true">
          {% icon tab.icon_name %}
          <span class="sr-only">{{ tab.name }}</span>
        </a>
      {% endfor %}
    </div>
  </div>
</nav>
