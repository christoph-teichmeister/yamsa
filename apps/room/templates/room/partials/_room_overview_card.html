{% comment %}
One room in the overview, as a real <button> of the navigation-row shape - so Enter and Space
work without the data-keyboard-click shim a div with role="button" needs. A button takes only
phrasing content, which is why the name is a <span> and not a heading.

.room-overview-card and the class hooks inside it are what the e2e suite and the view tests
address; the layout is in the utilities.

The card is its own container: how much of the meta line fits depends on the card, not on the
viewport - the same card is full width on a phone and half a column wide on a desktop.
{% endcomment %}
<button class="room-overview-card @container flex h-full w-full cursor-pointer rounded-2xl border border-line bg-surface-sunken px-3.5 py-3 text-left transition hover:-translate-y-0.5 hover:border-brand/55 hover:shadow-card-hover focus-visible:-translate-y-0.5 focus-visible:border-brand/55 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand motion-reduce:transition-none motion-reduce:hover:translate-y-0 motion-reduce:focus-visible:translate-y-0{% if entry.is_closed %} opacity-85{% endif %}{% if not entry.user_is_in_room %} italic{% endif %}"
        type="button"
        aria-label="{{ entry.name }}"
        hx-get="{{ entry.target_url }}"
        hx-target="#body"
        hx-indicator="#body-loading-spinner"
        hx-swap="morph:innerHTML"
        hx-push-url="true">
  {% if tile %}
    <span class="room-overview-card-tile flex min-w-0 flex-1 flex-col gap-1">
      <span class="mb-1 flex items-center justify-between gap-2">
        {% include "room/partials/_room_overview_circle.html" with entry=entry %}
        {% if entry.last_transaction_at %}
          <span class="room-overview-activity shrink-0 text-xs tabular-nums text-ink-subtle"
                title="{{ entry.last_transaction_at }}">{{ entry.last_transaction_at|room_last_used }}</span>
        {% endif %}
      </span>
      {# At most two lines: the name gets the full tile, but a long one must not outgrow the tile beside it. #}
      <span class="room-overview-name line-clamp-2 font-semibold [overflow-wrap:anywhere] text-ink">{{ entry.name }}</span>
      {# A closed room is settled and done with; its balance would only be noise on the tile. #}
      {% if entry.meta_text %}
        <span class="room-overview-meta block truncate text-sm text-ink-subtle">{{ entry.meta_text }}</span>
      {% endif %}
      {% if not entry.user_is_in_room %}
        {# Pushed to the bottom so the badges of two tiles in a row line up despite different name heights. #}
        <span class="room-overview-tile-status mt-auto flex pt-1.5">
          {% include "room/partials/_room_overview_status_badge.html" with entry=entry %}
        </span>
      {% endif %}
    </span>
  {% else %}
    <span class="flex min-w-0 flex-1 items-center gap-3">
      {% include "room/partials/_room_overview_circle.html" with entry=entry %}
      <span class="min-w-0 flex-1">
        <span class="room-overview-name block truncate font-semibold text-ink">{{ entry.name }}</span>
        {% if entry.meta_text or entry.last_transaction_at %}
          <span class="room-overview-meta flex min-w-0 items-baseline gap-2 text-sm whitespace-nowrap text-ink-subtle">
            {% comment %}
              The description shrinks all the way to nothing on a narrow card - it is the part of
              this line a room can be recognised without, and below 20rem a stub like "K…" says
              less than the time it crowds out. A separator glyph would survive that collapse and
              dangle in front of the time, so the gap is the only separator.
            {% endcomment %}
            {% if entry.meta_text %}
              <span class="room-overview-meta-text min-w-0 truncate @max-[20rem]:hidden">{{ entry.meta_text }}</span>
            {% endif %}
            {# Never shrinks: it explains why the row sits where it sits in the list. #}
            {% if entry.last_transaction_at %}
              <span class="room-overview-activity shrink-0 text-xs tabular-nums"
                    title="{{ entry.last_transaction_at }}">{{ entry.last_transaction_at|room_last_used }}</span>
            {% endif %}
          </span>
        {% endif %}
      </span>
      {% include "room/partials/_room_overview_amounts.html" with entry=entry %}
    </span>
  {% endif %}
</button>
