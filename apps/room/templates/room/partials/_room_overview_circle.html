{% comment %}
  The initials disc of an overview card. Smaller than the side menu's .room-circle, which is why
  it carries its own size rather than that class.
{% endcomment %}
<span class="tw:flex tw:size-10 tw:shrink-0 tw:items-center tw:justify-center tw:rounded-full tw:text-sm tw:font-semibold tw:uppercase {% if entry.is_closed %}tw:bg-danger-soft tw:text-danger-text{% else %}tw:bg-brand-soft tw:text-brand-text{% endif %}">
  {{ entry.capitalised_initials }}
</span>
