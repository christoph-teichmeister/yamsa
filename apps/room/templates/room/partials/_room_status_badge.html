{% load i18n %}
{% if current_room.is_closed %}
  <span class="tw:inline-flex tw:items-center tw:gap-1.5 tw:rounded-full tw:bg-danger-soft tw:px-2.5 tw:py-1 tw:text-xs tw:font-semibold tw:text-danger-text">
    <i class="bi bi-lock-fill" aria-hidden="true"></i>
    {% trans "Closed" %}
  </span>
{% else %}
  <span class="tw:inline-flex tw:items-center tw:gap-1.5 tw:rounded-full tw:bg-success-soft tw:px-2.5 tw:py-1 tw:text-xs tw:font-semibold tw:text-success-text">
    <i class="bi bi-unlock" aria-hidden="true"></i>
    {% trans "Open" %}
  </span>
{% endif %}
