{% load i18n %}
{% comment %}
  The one "new room" affordance, in the overview and in the side menu's room list. The menu passes
  dismiss_side_menu so the panel slides shut before htmx swaps the page underneath it.
{% endcomment %}
<button class="flex w-full cursor-pointer items-center gap-3 rounded-2xl border border-dashed border-brand/45 bg-transparent px-3.5 py-3 text-left transition hover:bg-brand-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
        type="button"
        {% if dismiss_side_menu %}data-dialog-close hx-trigger="click delay:300ms"{% endif %}
        hx-get="{{ create_url }}"
        hx-target="#body"
        hx-indicator="#body-loading-spinner"
        hx-swap="morph:innerHTML"
        hx-push-url="true">
  <span class="flex size-10 shrink-0 items-center justify-center rounded-full bg-brand-soft text-lg font-semibold text-brand-text"
        aria-hidden="true">+</span>
  <span class="min-w-0 flex-1">
    <span class="block truncate font-semibold text-ink">{% trans "New room" %}</span>
    <span class="block truncate text-sm text-ink-subtle">{% trans "Start a new group with friends" %}</span>
  </span>
  {% icon "chevron-right" "shrink-0 text-ink-subtle" %}
</button>
